# Vernex Auth Relay — nginx TLS terminator on port 5443
# Proxies to Flask relay app on 127.0.0.1:5000
#
# Install:
#   sudo cp nginx-relay.conf /etc/nginx/sites-available/vernex-relay
#   sudo ln -sf /etc/nginx/sites-available/vernex-relay /etc/nginx/sites-enabled/vernex-relay
#   sudo nginx -t && sudo systemctl reload nginx

# Let's Encrypt cert path (generated by deploy.sh)
# If using self-signed, deploy.sh writes to /etc/vernex-relay/tls/

server {
    listen 5443 ssl;
    server_name vernex.net;

    ssl_certificate     /etc/letsencrypt/live/vernex.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vernex.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

# HTTP: certbot ACME challenge + redirect
server {
    listen 80;
    server_name vernex.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host:5443$request_uri;
    }
}
