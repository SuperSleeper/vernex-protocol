# Vernex Protocol — nginx reverse proxy
# Install: sudo cp ~/vernex/scripts/nginx-vernex.conf /etc/nginx/sites-available/vernex
#          sudo ln -sf /etc/nginx/sites-available/vernex /etc/nginx/sites-enabled/vernex
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 5080;
    server_name _;

    # ── Internal auth subrequests ─────────────────────────────────────────────
    # nginx sends a subrequest to oauth.py; 200 = pass, 401/403 = gate.
    # The client Cookie header must be forwarded explicitly.

    location = /_auth_admin {
        internal;
        proxy_pass              http://127.0.0.1:5002/auth/verify?role=admin;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Cookie $http_cookie;
    }

    location = /_auth_user {
        internal;
        proxy_pass              http://127.0.0.1:5002/auth/verify?role=user;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Cookie $http_cookie;
    }

    # ── No-auth routes ────────────────────────────────────────────────────────

    # Install script delivery — LAN workers, no login required
    location /install {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # OAuth flow — login, callback, logout
    location /auth/ {
        proxy_pass       http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # Current-user info — returns 401 itself if unauthenticated
    location = /api/me {
        proxy_pass       http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    # ── User-role: chat UI + API ──────────────────────────────────────────────

    location /ui {
        auth_request     /_auth_user;
        error_page 401 = @login_redirect;
        error_page 403 = @forbidden;
        proxy_pass       http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location /api/ {
        auth_request     /_auth_user;
        error_page 401 = @login_redirect;
        error_page 403 = @forbidden;
        proxy_pass       http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    # ── Admin-role: full dashboard ────────────────────────────────────────────

    location / {
        auth_request     /_auth_admin;
        error_page 401 = @login_redirect;
        error_page 403 = @forbidden;
        proxy_pass       http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # ── Error handlers ────────────────────────────────────────────────────────

    location @login_redirect {
        return 302 /auth/login;
    }

    location @forbidden {
        default_type text/plain;
        return 403 "Access denied — insufficient role.";
    }
}
